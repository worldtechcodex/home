function teamPop(v){const[id,i]=v.split("|"),w=fw(id),m=w&&w.p.items[i];if(!m)return;BIO=m.bio||"Part of the World Tech Codex team in Bahawalpur.";const s=shortBio(BIO);$("#mb").innerHTML=`${ph("av","user",m.img)}<h3>${m.n||m.r}</h3>${m.n?`<span class="tr">${m.r}</span>`:""}<p class="bio" id="bio">${s?`${s}… <a class="rm" data-rm="more">Read more</a>`:BIO}</p><span class="btn" data-go="contact" tabindex="0" role="link">Contact Us</span>`;showPop("team")}
function lb(u){$("#mb").innerHTML=`<img src="${u}" alt="" style="max-height:80vh;border-radius:12px">`;showPop("wide")}
function closePop(){$("#md").classList.remove("on");$("#mb").className="mb"}
$("#md").addEventListener("click",e=>{if(e.target.id=="md")closePop()});
if(EDIT){document.body.classList.add("ed");const O=location.origin;
 const mark=()=>{document.querySelectorAll(".sel,.sel-e").forEach(x=>x.classList.remove("sel","sel-e"));const w=SEL&&document.getElementById(SEL);if(w){w.classList.add("sel");const q=SELE&&w.querySelector('[data-e="'+SELE+'"]');q&&q.classList.add("sel-e")}};MARK=mark;
 document.addEventListener("click",e=>{e.stopImmediatePropagation();e.preventDefault();const w=e.target.closest("[data-wid]"),a=e.target.closest("[data-a]");if(a&&w){parent.postMessage({act:a.dataset.a,id:w.dataset.wid},O);return}const el=e.target.closest("[data-e]");SEL=w?w.dataset.wid:null;SELE=el&&w&&w.contains(el)?el.dataset.e:null;mark();parent.postMessage({sel:SEL,path:SELE},O)},true);
 document.addEventListener("keydown",e=>{if(e.key=="Delete"&&SEL&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))parent.postMessage({act:SELE?"delel":"del",id:SEL,path:SELE},O)});
 const dz=document.createElement("div");dz.style.cssText="position:fixed;left:0;right:0;height:4px;background:#2271b1;z-index:9999;pointer-events:none;display:none";document.body.append(dz);
 const tgt=e=>{const ws=[...document.querySelectorAll("#app>.wx")];for(const w of ws){const r=w.getBoundingClientRect();if(e.clientY<r.top+r.height/2)return{id:w.id,after:0,y:r.top}}const l=ws[ws.length-1];return{id:l?l.id:null,after:1,y:l?l.getBoundingClientRect().bottom:0}};
 document.addEventListener("dragstart",e=>{const w=e.target.closest&&e.target.closest(".wx");if(w){e.dataTransfer.setData("text/plain",JSON.stringify({m:w.id}));e.dataTransfer.effectAllowed="move"}});
 document.addEventListener("dragover",e=>{e.preventDefault();const t=tgt(e);dz.style.display="block";dz.style.top=t.y-2+"px"});
 document.addEventListener("dragleave",e=>{if(!e.relatedTarget)dz.style.display="none"});document.addEventListener("dragend",()=>dz.style.display="none");
 document.addEventListener("drop",e=>{e.preventDefault();dz.style.display="none";const t=tgt(e);parent.postMessage({drop:{d:e.dataTransfer.getData("text/plain"),id:t.id,after:t.after}},O)});
 addEventListener("message",e=>{if(e.origin!=O||!e.data)return;if(e.data.wtc){D=e.data.wtc;if(e.data.sel!==undefined){SEL=e.data.sel;SELE=e.data.path||null}if(e.data.go&&location.hash!="#"+e.data.go)location.hash=e.data.go;else render()}});
 parent.postMessage({ready:1},O)}
if(!EDIT&&D.site.protect!==false){document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("dragstart",e=>{if(e.target.tagName=="IMG")e.preventDefault()});document.addEventListener("selectstart",e=>{if(e.target.tagName=="IMG")e.preventDefault()})}
render();

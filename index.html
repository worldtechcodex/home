.cp{text-align:center;color:var(--m);font-size:14px;border-top:1px solid var(--line);margin-top:36px;padding-top:18px}

.md{position:fixed;inset:0;background:rgba(25,30,50,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:99;opacity:0;visibility:hidden;pointer-events:none;transition:.3s;padding:20px}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
@media(max-width:1180px){.nl>a{padding:8px 9px;font-size:14px}.hd .btn{padding:10px 16px}}

nav{position:absolute;top:100%;left:0;right:0;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);overflow-y:auto;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:12px 20px 20px;gap:0;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);transition:.25s}
nav.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}.nl>a{padding:12px 10px}
.dd{display:none;position:static;opacity:1;visibility:inherit;transform:none;box-shadow:none;border:0;background:none;padding:0 0 6px 14px;min-width:0}.dd a:hover{padding-left:14px}.nl.sopen .dd{display:block}.nl.sopen .dc{transform:rotate(180deg)}.nl>a{display:flex;align-items:center;justify-content:space-between}.dc{padding:10px 12px;margin:-10px -6px -10px 0;font-size:13px}
.two,.fg{grid-template-columns:1fr}.pt{grid-template-columns:1fr}.pc.pop,.pc.pop:hover{transform:none}
.orb{opacity:.25}.tg .card{flex-basis:calc(50% - 12px)}.s{padding:60px 0}.two{gap:28px}.map{min-height:300px}}
@media(max-width:560px){.tg{gap:14px}.tg .card{flex-basis:calc(50% - 7px);padding:18px 10px}.tg .ph.av{width:92px;height:92px}.tg .card h3{font-size:16px}.s{padding:48px 0}.hero{min-height:70vh}.btn{padding:11px 20px}.hd{height:64px}.hero p{font-size:16px}.st b{font-size:28px}.card{padding:22px}.ph.pf{width:calc(100% + 44px);margin:-22px -22px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

let io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
function render(){
  const r=(location.hash||"#home").slice(1);const k=R[r]?r:"home";
  $("#app").innerHTML=R[k]();
  document.querySelectorAll(".reveal").forEach(e=>io.observe(e));
  document.querySelectorAll("nav .nl>a").forEach(a=>{const n=NAV.find(x=>x[0]==a.dataset.go);a.classList.toggle("on",!!(a.dataset.go==k||(n&&n[2]&&n[2].some(c=>c[0]==k))))});
  closeNav();scrollTo({top:0,behavior:"instant"});
  const t=(NAV.flatMap(n=>[[n[0],n[1]],...(n[2]||[])]).find(n=>n[0]==k)||[0,({privacy:"Privacy Policy",terms:"Terms & Conditions"})[k]||"Home"])[1];
  document.title=(k=="home"?"":t+" | ")+"World Tech Codex";
}
function closeNav(){$("#nav").classList.remove("open");document.querySelectorAll(".nl.sopen").forEach(x=>x.classList.remove("sopen"))}
$("#nav").innerHTML=NAV.map(n=>`<div class="nl">${A(n[0],n[1]+(n[2]?' <i class="fa-solid fa-chevron-down dc" data-tog></i>':""))}${n[2]?`<div class="dd">${n[2].map(c=>A(c[0],c[1])).join("")}</div>`:""}</div>`).join("")+`<div class="nl mob" style="display:none"><span class="btn" data-apply tabindex="0" role="button" style="margin-top:10px"><i class="fa-solid fa-briefcase"></i> Apply Now</span></div>`;
$("#ft").innerHTML=`<div><img src="logo.png" alt="World Tech Codex" style="height:56px;margin-bottom:12px" onerror="this.outerHTML='<b class=lt>WORLD <span>TECHCODEX</span></b>'"><p>Websites, web applications and AI solutions for growing businesses.</p><div class="so" style="margin-top:16px">${socials()}</div></div>
<div class="fl"><h4>Company</h4>${A("home","Home")}${A("about","About Us")}${A("team","Team")}${A("portfolio","Portfolio")}${A("contact","Contact")}</div>
<div class="fl"><h4>Services</h4>${S.map(s=>A(s.id,s.t)).join("")}${A("pricing","Pricing")}</div>
<div class="fl"><h4>Get in touch</h4><a data-ext="tel:${CFG.phone.replace(/ /g,"")}" tabindex="0" role="link"><i class="fa-solid fa-phone"></i> ${CFG.phone}</a><a data-ext="mailto:${CFG.email}" tabindex="0" role="link"><i class="fa-solid fa-envelope"></i> ${CFG.email}</a><a data-ext="https://www.google.com/maps/search/Bahawalpur+Punjab+Pakistan" tabindex="0" role="link"><i class="fa-solid fa-location-dot"></i> ${CFG.addr}</a></div>`;
$("#yr").textContent=new Date().getFullYear();

/* ===== events ===== */
function act(t){t.blur&&t.blur();
  if(t.dataset.go!==undefined){closePop();const g=t.dataset.go;location.hash===("#"+g)?render():location.hash=g}
  else if(t.dataset.ext){const u=t.dataset.ext;/^(tel|mailto):/.test(u)?location.href=u:window.open(u,"_blank","noopener")}
  else if(t.dataset.apply!==undefined){closeNav();applyPop()}
  else if(t.dataset.team!==undefined)teamPop(+t.dataset.team);
}
document.addEventListener("click",e=>{
  const tg=e.target.closest("[data-tog]");if(tg&&matchMedia("(max-width:1000px)").matches){tg.closest(".nl").classList.toggle("sopen");return}
  /* menu band ho to nav ke andar ke elements ko ignore karo (mobile ghost-click fix) */
  if(e.target.closest("nav")&&getComputedStyle($("#nav")).visibility==="hidden")return;
  const t=e.target.closest("[data-go],[data-ext],[data-apply],[data-team]");if(t)act(t)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const t=e.target.closest("[data-go],[data-ext],[data-apply],[data-team]");if(t)act(t)}if(e.key==="Escape"){closePop();closeNav()}});
$("#bg").onclick=()=>$("#nav").classList.toggle("open");
addEventListener("hashchange",render);
addEventListener("scroll",()=>$("#hd").classList.toggle("sc",scrollY>20),{passive:true});

/* ===== apply popup ===== */
function applyPop(){
  $("#mb").innerHTML=CFG.hiring
   ?`<i class="fa-solid fa-circle-check big"></i><h3>We are hiring</h3><p>Position: <b style="color:var(--t)">${CFG.role}</b><br>Apply between:<br><b style="color:var(--c)">${CFG.dates}</b></p><span class="btn" data-ext="${CFG.form}" tabindex="0" role="link"><i class="fa-brands fa-google"></i> Apply Now</span><button class="x" onclick="closePop()">Close</button>`
   :`<i class="fa-solid fa-briefcase big"></i><h3>No job openings right now</h3><p>We are not hiring at the moment. Follow our social pages to hear about new openings.</p><div class="so">${socials()}</div><button class="x" onclick="closePop()">Close</button>`;
  $("#md").classList.add("on");
}
function teamPop(i){const m=TEAM[i];if(!m)return;
  $("#mb").innerHTML=`${ph("av","user",m[2])}<h3>${m[0]||m[1]}</h3>${m[0]?`<span class="tr">${m[1]}</span>`:""}<p>${m[3]||"Part of the World Tech Codex team in Bahawalpur."}</p><span class="btn" data-go="contact" tabindex="0" role="link">Contact Us</span><button class="x" onclick="closePop()">Close</button>`;
  $("#md").classList.add("on");
}
function closePop(){$("#md").classList.remove("on")}
$("#md").addEventListener("click",e=>{if(e.target.id=="md")closePop()});
render();
</script>
